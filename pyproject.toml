[project]
name = "poc-due-diligence"
version = "0.1.0"
description = "Supplier due-diligence and risk-screening PoC — agentic pipeline with OpenSanctions, Indian Kanoon, Tavily, and Groq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "langgraph>=1.2.12",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "playwright>=1.63.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "agents", "tools", "schemas", "workflows", "db"]

[tool.pytest.ini_options]
testpaths = ["evals"]
pythonpath = ["."]
